<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Limit Checker</title>
<style>
body{font-family:Arial;background:#f0fdfa;padding:25px}
main{max-width:600px;margin:auto;background:white;padding:30px;border-radius:15px}
textarea{width:100%;height:200px;padding:15px;box-sizing:border-box;border:1px solid #99f6e4;border-radius:8px}
select{width:100%;padding:12px;margin-bottom:15px}
progress{width:100%;height:22px;accent-color:#0d9488}
#status{font-size:20px;font-weight:bold}
button{background:#0d9488;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Character Limit Checker</h1>
<p>Keep your writing within a selected limit.</p>
<select id="limit" onchange="check()">
<option value="160">160 Characters</option>
<option value="280">280 Characters</option>
<option value="500">500 Characters</option>
<option value="1000">1000 Characters</option>
</select>
<textarea id="text" placeholder="Write something..." oninput="check()"></textarea>
<p id="status"></p>
<progress id="progress" value="0" max="160"></progress>
<p id="remaining"></p>
<button onclick="clearText()">Clear Text</button>
</main>
<script>
function check(){
 const text=document.getElementById("text").value;
 const limit=Number(document.getElementById("limit").value);
 const count=[...text].length;
 const status=document.getElementById("status");
 status.textContent=count+" / "+limit+" characters";
 status.style.color=count>limit?"#dc2626":"#0d9488";
 document.getElementById("remaining").textContent=
 count>limit?(count-limit)+" characters over limit":(limit-count)+" characters remaining";
 document.getElementById("progress").max=limit;
 document.getElementById("progress").value=Math.min(count,limit);
}
function clearText(){
 document.getElementById("text").value="";
 check();
}
check();
</script>
</body>
</html>
